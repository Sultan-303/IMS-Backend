name: CI

on:
  push:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up .NET
        uses: actions/setup-dotnet@v1
        with:
          # Use a .NET 8.0 preview version that matches your local environment
          dotnet-version: '8.0.100-preview.7.23376.2'
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
        run: dotnet test

  update-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up .NET
        uses: actions/setup-dotnet@v1
        with:
          # Same .NET 8.0 preview version
          dotnet-version: '8.0.100-preview.7.23376.2'
      - name: Install dependencies
        run: dotnet restore
      - name: Install dotnet-ef tool (preview version)
        run: dotnet tool install --global dotnet-ef --version 8.0.0-preview.7.23375.2
        env:
          DOTNET_ROOT: /home/runner/.dotnet
          PATH: /home/runner/.dotnet/tools:$PATH
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: dotnet ef database update