name: IMS CI/CD Pipeline

on:
  push:
    branches: [ '**' ]

jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Debug Branch Info
      run: |
        echo "Current branch: ${{ github.ref }}"
        echo "Branch name: ${{ github.ref_name }}"
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    
    - name: Run Unit Tests
      run: dotnet test --filter Category=Unit
      env:
        ConnectionStrings__DefaultConnection: "Server=(localdb)\\MSSQLLocalDB;Database=IMS_Test;Trusted_Connection=True;"

  deploy-db:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Stop Existing Container
      run: docker-compose down
      continue-on-error: true
    
    - name: Start Production Database
      run: |
        docker-compose up -d db
        Start-Sleep -s 30
    
    - name: Update Production Database
      run: |
        cd IMS.API
        dotnet ef database update --connection "Server=localhost;Database=IMS_Production;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True"