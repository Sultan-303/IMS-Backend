name: IMS CI/CD Pipeline

on:
  push:
    branches: [ '**' ]

jobs:
  deploy-db:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy Database
      shell: pwsh
      run: |
        docker compose up -d db
        Start-Sleep -s 30
        dotnet tool install --global dotnet-ef
        cd IMS.API
        dotnet ef database update --connection "Server=localhost;Database=IMS_Production;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True"