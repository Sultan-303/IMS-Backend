name: CI

on:
  push:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0.x'
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
        run: dotnet test

  update-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0.x'
      - name: Install dependencies
        run: dotnet restore
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef
        env:
          DOTNET_ROOT: /home/runner/.dotnet
      - name: Create appsettings.json
        run: |
          echo '{
            "ConnectionStrings": {
              "DefaultConnection": "${{ secrets.DATABASE_URL_PROD }}"
            }
          }' > ./IMS.API/appsettings.json
      - name: Apply migrations
        working-directory: ./IMS.DAL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DOTNET_ROOT: /home/runner/.dotnet
          PATH: "/home/runner/.dotnet:/home/runner/.dotnet/tools:$PATH"
        run: dotnet ef database update --startup-project ../IMS.API/IMS.API.csproj --project ../IMS.DAL/IMS.DAL.csproj